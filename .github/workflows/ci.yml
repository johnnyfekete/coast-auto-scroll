name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Unit tests
        run: npm test

      # Playwright's browsers live outside the repository, so they are cached
      # rather than committed. The key is the Playwright version: a new one
      # needs a new browser, and nothing else does.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests
        run: npm run test:e2e
