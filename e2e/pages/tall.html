<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A long page</title>
    <style>
      body { margin: 0; font: 16px/1.6 system-ui, sans-serif; }
      p { margin: 0; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="filler"></div>
    <script>
      // 400 paragraphs is about 30,000px of page — far more than any test
      // scrolls through, so nothing here is ever near the bottom by accident.
      const filler = document.getElementById('filler');
      for (let i = 0; i < 400; i++) {
        const p = document.createElement('p');
        p.textContent = 'Paragraph ' + i;
        filler.appendChild(p);
      }
    </script>
  </body>
</html>
